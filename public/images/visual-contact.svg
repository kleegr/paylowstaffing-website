<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" role="img" aria-label="Contact PayLow">
  <defs>
    <linearGradient id="ctBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF4EC"/>
      <stop offset="100%" stop-color="#FFE3CF"/>
    </linearGradient>
    <linearGradient id="ctBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8242"/>
      <stop offset="100%" stop-color="#D9551A"/>
    </linearGradient>
    <filter id="ctShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" in="SourceAlpha"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="480" height="540" fill="url(#ctBg)" rx="40"/>
  <circle cx="380" cy="100" r="140" fill="url(#ctBrand)" opacity="0.20"/>
  <circle cx="100" cy="460" r="120" fill="#FFA065" opacity="0.25"/>

  <!-- Big envelope card -->
  <g transform="translate(80,90)" filter="url(#ctShadow)">
    <rect width="320" height="200" rx="24" fill="#FFFFFF"/>
    <path d="M20 60 L160 140 L300 60" stroke="url(#ctBrand)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="20" y="60" width="280" height="120" rx="10" fill="none" stroke="#EFEDE9" stroke-width="2"/>
    <text x="160" y="40" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#8B8474" letter-spacing="1.6" text-anchor="middle">REAL HUMANS</text>
  </g>

  <!-- Response time card -->
  <g transform="translate(80,320)" filter="url(#ctShadow)">
    <rect width="320" height="140" rx="24" fill="#0E0D0C"/>
    <text x="24" y="40" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#FFA065" letter-spacing="1.6">AVERAGE RESPONSE</text>
    <text x="24" y="86" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">&lt; 24 hrs</text>
    <rect x="24" y="104" width="60" height="18" rx="9" fill="url(#ctBrand)"/>
    <text x="54" y="116" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">FAST</text>
  </g>
</svg>
