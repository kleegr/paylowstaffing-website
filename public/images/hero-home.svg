<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" fill="none" role="img" aria-label="PayLow hiring dashboard">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF4EC"/>
      <stop offset="100%" stop-color="#FFE3CF"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8242"/>
      <stop offset="50%" stop-color="#F26C2A"/>
      <stop offset="100%" stop-color="#D9551A"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1816"/>
      <stop offset="100%" stop-color="#0E0D0C"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" in="SourceAlpha"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" in="SourceAlpha"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background blob -->
  <rect width="600" height="720" fill="url(#bgGrad)" rx="48"/>

  <!-- Floating gradient orb (top-right) -->
  <circle cx="500" cy="120" r="160" fill="url(#brandGrad)" opacity="0.18"/>
  <circle cx="120" cy="600" r="180" fill="#FFA065" opacity="0.20"/>

  <!-- ===== MAIN "TALENT MATCH" CARD (centered) ===== -->
  <g transform="translate(100,140)" filter="url(#cardShadow)">
    <rect width="400" height="440" rx="32" fill="#FFFFFF"/>
    <!-- Header bar -->
    <rect x="0" y="0" width="400" height="64" rx="32" fill="#FFFFFF"/>
    <rect x="0" y="44" width="400" height="20" fill="#FFFFFF"/>
    <circle cx="32" cy="32" r="6" fill="#F26C2A"/>
    <rect x="50" y="26" width="100" height="6" rx="3" fill="#2A2620"/>
    <rect x="50" y="38" width="60" height="4" rx="2" fill="#D7D3CB"/>
    <!-- Status pill (top right) -->
    <rect x="290" y="22" width="80" height="22" rx="11" fill="#FFF4EC" stroke="#FFC59E"/>
    <circle cx="304" cy="33" r="3" fill="#F26C2A"/>
    <rect x="314" y="29" width="48" height="8" rx="2" fill="#B53F0E"/>

    <!-- Divider -->
    <rect x="20" y="76" width="360" height="1" fill="#EFEDE9"/>

    <!-- Section label -->
    <rect x="20" y="92" width="90" height="8" rx="2" fill="#8B8474"/>

    <!-- 3 candidate rows -->
    <g transform="translate(0,116)">
      <!-- Row 1 (top match — highlighted) -->
      <rect x="16" y="0" width="368" height="76" rx="20" fill="#FFF4EC" stroke="#FFC59E"/>
      <circle cx="48" cy="38" r="20" fill="url(#brandGrad)"/>
      <text x="48" y="44" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">AK</text>
      <rect x="80" y="22" width="120" height="9" rx="3" fill="#1A1816"/>
      <rect x="80" y="38" width="180" height="6" rx="2" fill="#8B8474"/>
      <rect x="80" y="50" width="60" height="6" rx="2" fill="#B5AFA3"/>
      <!-- Match badge -->
      <rect x="296" y="28" width="76" height="22" rx="11" fill="url(#brandGrad)"/>
      <text x="334" y="43" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">98% MATCH</text>
      <!-- Skills tags -->
      <rect x="296" y="56" width="36" height="14" rx="7" fill="#FFFFFF" stroke="#FFC59E"/>
      <text x="314" y="66" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="600" fill="#B53F0E" text-anchor="middle">Sr.</text>
      <rect x="336" y="56" width="36" height="14" rx="7" fill="#FFFFFF" stroke="#FFC59E"/>
      <text x="354" y="66" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="600" fill="#B53F0E" text-anchor="middle">5y+</text>
    </g>

    <g transform="translate(0,208)">
      <rect x="16" y="0" width="368" height="64" rx="18" fill="#F8F7F5"/>
      <circle cx="48" cy="32" r="18" fill="#2A2620"/>
      <text x="48" y="37" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">RP</text>
      <rect x="78" y="20" width="100" height="8" rx="3" fill="#2A2620"/>
      <rect x="78" y="34" width="150" height="5" rx="2" fill="#8B8474"/>
      <rect x="78" y="44" width="50" height="5" rx="2" fill="#B5AFA3"/>
      <rect x="312" y="24" width="56" height="16" rx="8" fill="#EFEDE9"/>
      <text x="340" y="35" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#5F594D" text-anchor="middle">91%</text>
    </g>

    <g transform="translate(0,284)">
      <rect x="16" y="0" width="368" height="64" rx="18" fill="#F8F7F5"/>
      <circle cx="48" cy="32" r="18" fill="#FFA065"/>
      <text x="48" y="37" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">JS</text>
      <rect x="78" y="20" width="90" height="8" rx="3" fill="#2A2620"/>
      <rect x="78" y="34" width="160" height="5" rx="2" fill="#8B8474"/>
      <rect x="78" y="44" width="50" height="5" rx="2" fill="#B5AFA3"/>
      <rect x="312" y="24" width="56" height="16" rx="8" fill="#EFEDE9"/>
      <text x="340" y="35" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#5F594D" text-anchor="middle">87%</text>
    </g>

    <!-- Bottom CTA bar -->
    <rect x="16" y="372" width="368" height="48" rx="16" fill="#0E0D0C"/>
    <text x="200" y="402" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Shortlist ready in 3 days →</text>
  </g>

  <!-- ===== FLOATING METRIC CARD (top-left) ===== -->
  <g transform="translate(40,80)" filter="url(#softShadow)">
    <rect width="170" height="86" rx="22" fill="#FFFFFF"/>
    <rect x="14" y="14" width="32" height="32" rx="10" fill="url(#brandGrad)"/>
    <path d="M22 30 l6 6 l12 -12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="14" y="64" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" fill="#8B8474" letter-spacing="1.5">PRE-VETTED</text>
    <text x="14" y="78" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#0E0D0C">100% guaranteed</text>
  </g>

  <!-- ===== FLOATING $ SAVINGS CARD (right) ===== -->
  <g transform="translate(420,500)" filter="url(#softShadow)">
    <rect width="160" height="100" rx="22" fill="url(#darkGrad)"/>
    <text x="20" y="36" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" fill="#FFA065" letter-spacing="1.5">MONTHLY SAVED</text>
    <text x="20" y="68" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">$11,937</text>
    <rect x="20" y="78" width="56" height="14" rx="7" fill="#F26C2A"/>
    <text x="48" y="88" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">77% LOWER</text>
  </g>

  <!-- ===== FLOATING TIME-TO-HIRE CARD (left bottom) ===== -->
  <g transform="translate(40,560)" filter="url(#softShadow)">
    <rect width="190" height="90" rx="22" fill="#FFFFFF"/>
    <g transform="translate(14,18)">
      <circle cx="20" cy="20" r="18" fill="none" stroke="#EFEDE9" stroke-width="4"/>
      <circle cx="20" cy="20" r="18" fill="none" stroke="url(#brandGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="100 113" transform="rotate(-90 20 20)"/>
    </g>
    <text x="68" y="40" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" fill="#8B8474" letter-spacing="1.5">AVG TIME TO HIRE</text>
    <text x="68" y="62" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0E0D0C">7 days</text>
  </g>

  <!-- Subtle sparkle accents -->
  <g opacity="0.65">
    <path d="M540 280 l4 -10 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 z" fill="#F26C2A"/>
    <path d="M70 310 l3 -8 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 z" fill="#FFA065"/>
  </g>
</svg>
