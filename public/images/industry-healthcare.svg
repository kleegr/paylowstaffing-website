<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Healthcare staffing">
  <defs>
    <linearGradient id="hcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1816"/>
      <stop offset="100%" stop-color="#0E0D0C"/>
    </linearGradient>
    <linearGradient id="hcBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8242"/>
      <stop offset="100%" stop-color="#D9551A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#hcBg)"/>
  <circle cx="320" cy="380" r="160" fill="url(#hcBrand)" opacity="0.22"/>
  <!-- Heartbeat line -->
  <g transform="translate(40,240)" opacity="0.9">
    <path d="M0 30 L60 30 L80 0 L100 60 L120 30 L160 30 L180 10 L200 30 L320 30" stroke="url(#hcBrand)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M0 30 L60 30 L80 0 L100 60 L120 30 L160 30 L180 10 L200 30 L320 30" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.2" transform="translate(0,40)"/>
  </g>
  <!-- Cross emblem card -->
  <g transform="translate(150,80)">
    <rect x="0" y="0" width="100" height="100" rx="24" fill="#FFFFFF"/>
    <rect x="42" y="22" width="16" height="56" rx="4" fill="url(#hcBrand)"/>
    <rect x="22" y="42" width="56" height="16" rx="4" fill="url(#hcBrand)"/>
  </g>
  <!-- Stethoscope detail -->
  <g transform="translate(80,350)" opacity="0.85">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="0" cy="0" r="8" fill="url(#hcBrand)"/>
    <path d="M0 -20 Q30 -50 60 -30" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
