<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 44" fill="none" role="img" aria-label="PayLow Staffing">
  <!-- Mark: stacked rounded chevrons forming a "P"-style abstraction in brand orange -->
  <defs>
    <linearGradient id="paylowMarkLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8242"/>
      <stop offset="55%" stop-color="#F26C2A"/>
      <stop offset="100%" stop-color="#D9551A"/>
    </linearGradient>
  </defs>
  <g transform="translate(2,4)">
    <!-- The mark: an abstract "rising bar" P, modern and geometric -->
    <rect x="0" y="0" width="9" height="36" rx="2.5" fill="url(#paylowMarkLight)"/>
    <rect x="12" y="0" width="22" height="9" rx="2.5" fill="url(#paylowMarkLight)"/>
    <rect x="12" y="13.5" width="16" height="9" rx="2.5" fill="url(#paylowMarkLight)" opacity="0.85"/>
  </g>
  <!-- Wordmark -->
  <text x="44" y="29" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.02em" fill="#0E0D0C">PayLow</text>
  <text x="44" y="41" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="8" font-weight="600" letter-spacing="0.22em" fill="#8B8474">STAFFING</text>
</svg>
