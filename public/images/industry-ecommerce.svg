<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="E-commerce staffing">
  <defs>
    <linearGradient id="ecBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5E1F04"/>
      <stop offset="100%" stop-color="#2A2620"/>
    </linearGradient>
    <linearGradient id="ecBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFA065"/>
      <stop offset="100%" stop-color="#F26C2A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#ecBg)"/>
  <circle cx="80" cy="100" r="160" fill="url(#ecBrand)" opacity="0.22"/>
  <!-- Stylized stacked package boxes -->
  <g transform="translate(110,170)">
    <rect x="0" y="120" width="180" height="120" rx="10" fill="#FFFFFF" opacity="0.14"/>
    <rect x="30" y="40" width="180" height="120" rx="10" fill="url(#ecBrand)"/>
    <rect x="0" y="0" width="160" height="100" rx="10" fill="#FFFFFF"/>
    <!-- Tape line on top box -->
    <rect x="0" y="45" width="160" height="10" fill="#FFE3CF" opacity="0.6"/>
    <!-- Box label -->
    <rect x="20" y="20" width="60" height="6" rx="2" fill="#0E0D0C"/>
    <rect x="20" y="32" width="40" height="4" rx="2" fill="#8B8474"/>
    <!-- Barcode on second box -->
    <g transform="translate(50,90)" opacity="0.5">
      <rect x="0" y="0" width="2" height="30" fill="#FFFFFF"/>
      <rect x="6" y="0" width="4" height="30" fill="#FFFFFF"/>
      <rect x="14" y="0" width="2" height="30" fill="#FFFFFF"/>
      <rect x="20" y="0" width="6" height="30" fill="#FFFFFF"/>
      <rect x="30" y="0" width="2" height="30" fill="#FFFFFF"/>
      <rect x="36" y="0" width="4" height="30" fill="#FFFFFF"/>
    </g>
  </g>
  <!-- Cart badge -->
  <g transform="translate(260,360)">
    <circle cx="0" cy="0" r="24" fill="#FFFFFF"/>
    <path d="M-10 -6 L-6 -6 L-4 6 L8 6 L10 -2 L-2 -2" stroke="url(#ecBrand)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="-2" cy="10" r="2" fill="url(#ecBrand)"/>
    <circle cx="6" cy="10" r="2" fill="url(#ecBrand)"/>
  </g>
</svg>
