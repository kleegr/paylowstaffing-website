      <stop offset="0%" stop-color="#1A1816"/>
      <stop offset="100%" stop-color="#0E0D0C"/>
    </linearGradient>
    <linearGradient id="csBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8242"/>
      <stop offset="100%" stop-color="#D9551A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#csBg)"/>
  <circle cx="100" cy="380" r="160" fill="url(#csBrand)" opacity="0.22"/>
  <!-- Chat bubbles -->
  <g transform="translate(60,120)">
    <rect x="0" y="0" width="180" height="60" rx="22" fill="#FFFFFF"/>
    <path d="M16 56 L24 70 L34 56" fill="#FFFFFF"/>
    <rect x="16" y="18" width="120" height="6" rx="2" fill="#2A2620"/>
    <rect x="16" y="32" width="90" height="5" rx="2" fill="#8B8474"/>
    <circle cx="152" cy="30" r="4" fill="#5DD39E"/>
  </g>
  <g transform="translate(120,200)">
    <rect x="0" y="0" width="200" height="68" rx="22" fill="url(#csBrand)"/>
    <path d="M164 64 L172 80 L180 64" fill="url(#csBrand)"/>
    <rect x="16" y="20" width="140" height="6" rx="2" fill="#FFFFFF"/>
    <rect x="16" y="34" width="110" height="5" rx="2" fill="#FFFFFF" opacity="0.75"/>
