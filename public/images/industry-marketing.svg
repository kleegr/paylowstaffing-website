<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Marketing staffing">
  <defs>
    <linearGradient id="mkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A2620"/>
      <stop offset="100%" stop-color="#0E0D0C"/>
    </linearGradient>
    <linearGradient id="mkBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8242"/>
      <stop offset="100%" stop-color="#D9551A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#mkBg)"/>
  <!-- Megaphone abstract -->
  <g transform="translate(120,160)">
    <path d="M0 60 L100 20 L100 100 L0 60 Z" fill="url(#mkBrand)"/>
    <rect x="100" y="40" width="40" height="40" rx="6" fill="#FFFFFF"/>
    <rect x="-30" y="45" width="30" height="30" rx="6" fill="url(#mkBrand)" opacity="0.5"/>
    <!-- Sound waves -->
    <path d="M150 50 Q170 60 150 70" stroke="url(#mkBrand)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M160 36 Q190 60 160 84" stroke="url(#mkBrand)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M170 22 Q210 60 170 98" stroke="url(#mkBrand)" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Engagement pills -->
  <g transform="translate(60,340)">
    <rect x="0" y="0" width="100" height="34" rx="17" fill="#FFFFFF"/>
    <text x="50" y="22" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0E0D0C" text-anchor="middle">+428% CTR</text>
  </g>
  <g transform="translate(180,360)">
    <rect x="0" y="0" width="120" height="34" rx="17" fill="url(#mkBrand)"/>
    <text x="60" y="22" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">12K leads/mo</text>
  </g>
  <g transform="translate(100,400)">
    <rect x="0" y="0" width="110" height="34" rx="17" fill="#FFFFFF" opacity="0.15"/>
    <text x="55" y="22" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">SEO ↑ 6×</text>
  </g>
</svg>
