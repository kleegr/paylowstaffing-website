<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Real estate staffing">
  <defs>
    <linearGradient id="reBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A2620"/>
      <stop offset="100%" stop-color="#0E0D0C"/>
    </linearGradient>
    <linearGradient id="reBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8242"/>
      <stop offset="100%" stop-color="#D9551A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#reBg)"/>
  <circle cx="320" cy="100" r="140" fill="url(#reBrand)" opacity="0.25"/>
  <!-- Stylized building skyline -->
  <g transform="translate(70,180)" opacity="0.92">
    <rect x="0" y="60" width="50" height="180" rx="6" fill="#FFFFFF" opacity="0.12"/>
    <rect x="58" y="30" width="58" height="210" rx="6" fill="#FFFFFF" opacity="0.18"/>
    <rect x="124" y="0" width="70" height="240" rx="8" fill="url(#reBrand)"/>
    <rect x="202" y="50" width="56" height="190" rx="6" fill="#FFFFFF" opacity="0.18"/>
    <!-- Windows -->
    <g fill="#FFE3CF" opacity="0.8">
      <rect x="138" y="20" width="10" height="10" rx="1"/>
      <rect x="158" y="20" width="10" height="10" rx="1"/>
      <rect x="178" y="20" width="10" height="10" rx="1"/>
      <rect x="138" y="50" width="10" height="10" rx="1"/>
      <rect x="158" y="50" width="10" height="10" rx="1"/>
      <rect x="178" y="50" width="10" height="10" rx="1"/>
      <rect x="138" y="80" width="10" height="10" rx="1"/>
      <rect x="158" y="80" width="10" height="10" rx="1"/>
      <rect x="178" y="80" width="10" height="10" rx="1"/>
      <rect x="138" y="110" width="10" height="10" rx="1"/>
      <rect x="158" y="110" width="10" height="10" rx="1"/>
      <rect x="178" y="110" width="10" height="10" rx="1"/>
    </g>
  </g>
  <!-- Floating key tag -->
  <g transform="translate(240,340)" opacity="0.95">
    <circle cx="0" cy="0" r="22" fill="#FFFFFF"/>
    <path d="M-8 -2 L8 -2 L8 2 L4 2 L4 6 L0 6 L0 2 L-8 2 Z" fill="url(#reBrand)" transform="translate(0,-2)"/>
    <circle cx="-6" cy="-2" r="4" fill="none" stroke="url(#reBrand)" stroke-width="2"/>
  </g>
</svg>
