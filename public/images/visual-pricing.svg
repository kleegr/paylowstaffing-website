<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" role="img" aria-label="PayLow pricing visual">
  <defs>
    <linearGradient id="prB" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFF4EC"/><stop offset="100%" stop-color="#FFC59E"/></linearGradient>
    <linearGradient id="prBr" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FF8242"/><stop offset="100%" stop-color="#D9551A"/></linearGradient>
    <filter id="prSh" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14" in="SourceAlpha"/><feOffset dx="0" dy="8"/><feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="480" height="540" fill="url(#prB)" rx="40"/>
  <!-- Onshore card -->
  <g transform="translate(60,80)" filter="url(#prSh)">
    <rect width="170" height="160" rx="22" fill="#FFFFFF"/>
    <text x="22" y="36" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#8B8474" letter-spacing="1.5">ONSHORE</text>
    <text x="22" y="100" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="800" fill="#0E0D0C">$30</text>
    <text x="22" y="126" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8B8474">per hour + taxes</text>
    <rect x="22" y="136" width="40" height="6" rx="3" fill="#D7D3CB"/>
  </g>
  <!-- PayLow card (highlighted) -->
  <g transform="translate(250,140)" filter="url(#prSh)">
    <rect width="170" height="180" rx="22" fill="url(#prBr)"/>
    <text x="22" y="36" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">PAYLOW</text>
    <text x="22" y="108" font-family="Inter, system-ui, sans-serif" font-size="68" font-weight="800" fill="#FFFFFF">$7</text>
    <text x="22" y="134" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" opacity="0.9">all-in. no taxes.</text>
    <rect x="22" y="148" width="100" height="20" rx="10" fill="#FFFFFF"/>
    <text x="72" y="161" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#B53F0E" text-anchor="middle">77% LOWER</text>
  </g>
  <!-- Savings annual card -->
  <g transform="translate(60,340)" filter="url(#prSh)">
    <rect width="360" height="140" rx="22" fill="#0E0D0C"/>
    <text x="24" y="38" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#FFA065" letter-spacing="1.5">3 PEOPLE · ANNUAL SAVINGS</text>
    <text x="24" y="94" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF">$143,520</text>
    <text x="24" y="118" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#FFFFFF" opacity="0.65">vs. hiring locally · same roles</text>
  </g>
</svg>
