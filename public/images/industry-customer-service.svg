    <path d="M-16 -4 Q-16 -20 0 -20 Q16 -20 16 -4" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
    <rect x="-18" y="-6" width="6" height="12" rx="3" fill="#FFFFFF"/>
