<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Finance staffing">
  <defs>
    <linearGradient id="fiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A2620"/>
      <stop offset="100%" stop-color="#0E0D0C"/>
    </linearGradient>
    <linearGradient id="fiBrand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFA065"/>
      <stop offset="100%" stop-color="#F26C2A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#fiBg)"/>
  <!-- Bar chart -->
  <g transform="translate(60,130)">
    <line x1="0" y1="240" x2="280" y2="240" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <rect x="10" y="160" width="30" height="80" rx="6" fill="#FFFFFF" opacity="0.18"/>
    <rect x="54" y="120" width="30" height="120" rx="6" fill="#FFFFFF" opacity="0.25"/>
    <rect x="98" y="80" width="30" height="160" rx="6" fill="#FFA065" opacity="0.7"/>
    <rect x="142" y="40" width="30" height="200" rx="6" fill="url(#fiBrand)"/>
    <rect x="186" y="10" width="30" height="230" rx="6" fill="url(#fiBrand)"/>
    <rect x="230" y="-20" width="30" height="260" rx="6" fill="#FFFFFF"/>
    <!-- Trend line -->
    <path d="M25 180 L69 140 L113 100 L157 60 L201 30 L245 0" stroke="#F26C2A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0"/>
  </g>
  <!-- Dollar badge -->
  <g transform="translate(280,80)">
    <circle cx="0" cy="0" r="26" fill="url(#fiBrand)"/>
    <text x="0" y="8" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">$</text>
  </g>
  <!-- KPI mini-card -->
  <g transform="translate(50,400)">
    <rect width="160" height="60" rx="14" fill="#FFFFFF"/>
    <text x="14" y="26" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" fill="#8B8474" letter-spacing="1.5">REVENUE GROWTH</text>
    <text x="14" y="48" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#0E0D0C">+218%</text>
  </g>
</svg>
