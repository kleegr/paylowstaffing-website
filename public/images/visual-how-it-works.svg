<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" role="img" aria-label="How it works">
  <defs>
    <linearGradient id="hwBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF4EC"/>
      <stop offset="100%" stop-color="#FFC59E"/>
    </linearGradient>
    <linearGradient id="hwBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8242"/>
      <stop offset="100%" stop-color="#D9551A"/>
    </linearGradient>
    <filter id="hwShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" in="SourceAlpha"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="480" height="540" fill="url(#hwBg)" rx="40"/>

  <!-- 4 step nodes connected by a path -->
  <g transform="translate(80,80)">
    <!-- Connecting path -->
    <path d="M40 40 Q120 -20 200 40 Q280 100 320 40" stroke="#F26C2A" stroke-width="3" stroke-dasharray="6 6" fill="none" opacity="0.6" transform="translate(0,40)"/>
    <path d="M40 160 Q120 100 200 160 Q280 220 320 160" stroke="#F26C2A" stroke-width="3" stroke-dasharray="6 6" fill="none" opacity="0.6"/>

    <!-- Step 1 card -->
    <g filter="url(#hwShadow)">
      <rect x="0" y="0" width="140" height="100" rx="22" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="12" fill="url(#hwBrand)"/>
      <text x="24" y="29" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
      <text x="24" y="60" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0E0D0C">Discovery</text>
      <text x="24" y="78" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#8B8474">15-min scoping call</text>
    </g>
    <g transform="translate(180,40)" filter="url(#hwShadow)">
      <rect x="0" y="0" width="140" height="100" rx="22" fill="url(#hwBrand)"/>
      <circle cx="24" cy="24" r="12" fill="#FFFFFF"/>
      <text x="24" y="29" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#F26C2A" text-anchor="middle">2</text>
      <text x="24" y="60" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Matching</text>
      <text x="24" y="78" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#FFFFFF" opacity="0.85">Vetted shortlist</text>
    </g>
    <g transform="translate(0,200)" filter="url(#hwShadow)">
      <rect x="0" y="0" width="140" height="100" rx="22" fill="#0E0D0C"/>
      <circle cx="24" cy="24" r="12" fill="url(#hwBrand)"/>
      <text x="24" y="29" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
      <text x="24" y="60" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Interview</text>
      <text x="24" y="78" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#FFA065">Meet · You pick</text>
    </g>
    <g transform="translate(180,240)" filter="url(#hwShadow)">
      <rect x="0" y="0" width="140" height="100" rx="22" fill="#FFFFFF"/>
      <circle cx="24" cy="24" r="12" fill="url(#hwBrand)"/>
      <text x="24" y="29" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
      <text x="24" y="60" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0E0D0C">Onboard</text>
      <text x="24" y="78" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#8B8474">Productive day 1</text>
    </g>
  </g>

  <!-- Bottom timeline -->
  <g transform="translate(80,460)" filter="url(#hwShadow)">
    <rect width="320" height="50" rx="20" fill="#FFFFFF"/>
    <text x="160" y="22" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#8B8474" letter-spacing="1.6" text-anchor="middle">END-TO-END</text>
    <text x="160" y="40" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#0E0D0C" text-anchor="middle">7 days average</text>
  </g>
</svg>
