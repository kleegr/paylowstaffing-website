<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Creative and design staffing">
  <defs>
    <linearGradient id="crBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E0D0C"/>
      <stop offset="100%" stop-color="#5E1F04"/>
    </linearGradient>
    <linearGradient id="crBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFA065"/>
      <stop offset="100%" stop-color="#F26C2A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#crBg)"/>
  <!-- Layered design tool -->
  <g transform="translate(70,130)">
    <rect x="0" y="0" width="260" height="240" rx="20" fill="#FFFFFF"/>
    <!-- Toolbar -->
    <rect x="0" y="0" width="40" height="240" rx="20" fill="#F8F7F5"/>
    <rect x="0" y="40" width="40" height="200" fill="#F8F7F5"/>
    <g transform="translate(20,40)">
      <circle cx="0" cy="0" r="8" fill="url(#crBrand)"/>
      <rect x="-7" y="24" width="14" height="14" rx="3" fill="#8B8474" opacity="0.5"/>
      <path d="M-7 60 L7 60 L0 74 Z" fill="#8B8474" opacity="0.5"/>
      <circle cx="0" cy="96" r="7" fill="none" stroke="#8B8474" stroke-width="2" opacity="0.5"/>
      <path d="M-7 124 L7 124 M0 117 L0 131" stroke="#8B8474" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    </g>
    <!-- Canvas content -->
    <rect x="60" y="24" width="170" height="100" rx="10" fill="#FFE3CF"/>
    <circle cx="100" cy="60" r="22" fill="url(#crBrand)"/>
    <rect x="130" y="50" width="60" height="6" rx="2" fill="#0E0D0C"/>
    <rect x="130" y="64" width="40" height="5" rx="2" fill="#5F594D"/>
    <rect x="60" y="140" width="80" height="72" rx="10" fill="#0E0D0C"/>
    <rect x="152" y="140" width="78" height="34" rx="10" fill="#FFA065"/>
    <rect x="152" y="180" width="78" height="32" rx="10" fill="#F8F7F5"/>
  </g>
  <!-- Pen tip badge -->
  <g transform="translate(290,400)">
    <circle cx="0" cy="0" r="24" fill="url(#crBrand)"/>
    <path d="M-8 -8 L4 4 L8 8 L4 12 L-12 -4 Z M-8 -8 L-4 -12 L8 0 L4 4 Z" fill="#FFFFFF"/>
  </g>
</svg>
