<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" role="img" aria-label="PayLow story">
  <defs>
    <linearGradient id="asBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF4EC"/>
      <stop offset="100%" stop-color="#FFE3CF"/>
    </linearGradient>
    <linearGradient id="asBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8242"/>
      <stop offset="100%" stop-color="#D9551A"/>
    </linearGradient>
    <filter id="asShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" in="SourceAlpha"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="480" height="600" fill="url(#asBg)" rx="40"/>
  <circle cx="380" cy="500" r="160" fill="url(#asBrand)" opacity="0.18"/>

  <!-- Big stat card -->
  <g transform="translate(40,60)" filter="url(#asShadow)">
    <rect width="260" height="180" rx="24" fill="#FFFFFF"/>
    <text x="24" y="38" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#8B8474" letter-spacing="1.6">FOUNDED ON</text>
    <text x="24" y="90" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="800" fill="#0E0D0C">A real</text>
    <text x="24" y="132" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="800" fill="url(#asBrand)">problem.</text>
    <rect x="24" y="148" width="44" height="4" rx="2" fill="url(#asBrand)"/>
  </g>

  <!-- Photo placeholder card (abstract person silhouette) -->
  <g transform="translate(320,90)" filter="url(#asShadow)">
    <rect width="130" height="180" rx="22" fill="#FFFFFF"/>
    <rect x="0" y="0" width="130" height="180" rx="22" fill="url(#asBrand)" opacity="0.12"/>
    <!-- Abstract avatar -->
    <circle cx="65" cy="70" r="24" fill="url(#asBrand)"/>
    <path d="M30 150 Q30 110 65 110 Q100 110 100 150 Z" fill="url(#asBrand)"/>
  </g>

  <!-- Stats grid card -->
  <g transform="translate(40,280)" filter="url(#asShadow)">
    <rect width="410" height="100" rx="24" fill="#0E0D0C"/>
    <g transform="translate(24,30)">
      <text font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" fill="#FFA065" letter-spacing="1.5">JOBS</text>
      <text y="32" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">3K+</text>
    </g>
    <g transform="translate(140,30)">
      <text font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" fill="#FFA065" letter-spacing="1.5">COUNTRIES</text>
      <text y="32" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">78+</text>
    </g>
    <g transform="translate(260,30)">
      <text font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" fill="#FFA065" letter-spacing="1.5">ROLES</text>
      <text y="32" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">12K+</text>
    </g>
  </g>

  <!-- Map / global -->
  <g transform="translate(40,410)" filter="url(#asShadow)">
    <rect width="410" height="150" rx="24" fill="#FFFFFF"/>
    <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#8B8474" letter-spacing="1.6">GLOBAL TALENT</text>
    <text x="24" y="60" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0E0D0C">Every time zone covered.</text>
    <!-- Dot world map -->
    <g transform="translate(24,80)" fill="#F26C2A">
      <circle cx="10" cy="10" r="3"/>
      <circle cx="30" cy="6" r="4" fill="#FFA065"/>
      <circle cx="50" cy="14" r="3"/>
      <circle cx="72" cy="4" r="3" fill="#FFC59E"/>
      <circle cx="94" cy="12" r="4"/>
      <circle cx="118" cy="6" r="3" fill="#FFA065"/>
      <circle cx="140" cy="16" r="3"/>
      <circle cx="164" cy="8" r="4"/>
      <circle cx="188" cy="14" r="3" fill="#FFC59E"/>
      <circle cx="212" cy="4" r="3"/>
      <circle cx="234" cy="12" r="3" fill="#FFA065"/>
      <circle cx="258" cy="8" r="4"/>
      <circle cx="282" cy="14" r="3"/>
      <circle cx="306" cy="6" r="3" fill="#FFC59E"/>
      <circle cx="332" cy="12" r="3"/>
      <circle cx="354" cy="4" r="4"/>
      <circle cx="18" cy="34" r="3" fill="#FFA065"/>
      <circle cx="42" cy="38" r="3"/>
      <circle cx="68" cy="32" r="4"/>
      <circle cx="94" cy="38" r="3" fill="#FFC59E"/>
      <circle cx="120" cy="34" r="3"/>
      <circle cx="148" cy="40" r="4" fill="#FFA065"/>
      <circle cx="174" cy="32" r="3"/>
      <circle cx="200" cy="36" r="3"/>
      <circle cx="228" cy="40" r="3" fill="#FFC59E"/>
      <circle cx="254" cy="32" r="4"/>
      <circle cx="282" cy="36" r="3" fill="#FFA065"/>
      <circle cx="308" cy="32" r="3"/>
      <circle cx="336" cy="38" r="3"/>
      <circle cx="360" cy="34" r="3" fill="#FFC59E"/>
    </g>
  </g>
</svg>
