<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="IT and tech staffing">
  <defs>
    <linearGradient id="itBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E0D0C"/>
      <stop offset="100%" stop-color="#1A1816"/>
    </linearGradient>
    <linearGradient id="itBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFA065"/>
      <stop offset="100%" stop-color="#F26C2A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#itBg)"/>
  <circle cx="200" cy="250" r="190" fill="url(#itBrand)" opacity="0.16"/>
  <!-- Terminal window -->
  <g transform="translate(60,140)">
    <rect x="0" y="0" width="280" height="220" rx="16" fill="#FFFFFF" opacity="0.97"/>
    <!-- Window header -->
    <rect x="0" y="0" width="280" height="32" rx="16" fill="#F8F7F5"/>
    <rect x="0" y="16" width="280" height="16" fill="#F8F7F5"/>
    <circle cx="16" cy="16" r="5" fill="#FF6B6B"/>
    <circle cx="34" cy="16" r="5" fill="#FFC940"/>
    <circle cx="52" cy="16" r="5" fill="#5DD39E"/>
    <!-- Code lines -->
    <g transform="translate(20,52)" font-family="monospace" font-size="12">
      <text x="0" y="0" fill="#8B8474">$</text>
      <text x="14" y="0" fill="#0E0D0C">paylow </text>
      <text x="74" y="0" fill="#F26C2A">hire</text>
      <text x="110" y="0" fill="#5F594D">--role=engineer</text>
      <text x="0" y="24" fill="#5DD39E">✓</text>
      <text x="14" y="24" fill="#5F594D">matched 3 candidates</text>
      <text x="0" y="48" fill="#5DD39E">✓</text>
      <text x="14" y="48" fill="#5F594D">scheduled interviews</text>
      <text x="0" y="72" fill="#5DD39E">✓</text>
      <text x="14" y="72" fill="#5F594D">onboarded in 7 days</text>
      <rect x="0" y="94" width="6" height="14" fill="#F26C2A"/>
      <text x="14" y="105" fill="#0E0D0C" font-weight="700">_</text>
    </g>
    <!-- Status pill -->
    <rect x="196" y="176" width="68" height="22" rx="11" fill="#FFF4EC"/>
    <circle cx="208" cy="187" r="3" fill="#F26C2A"/>
    <text x="218" y="191" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#B53F0E">LIVE</text>
  </g>
</svg>
